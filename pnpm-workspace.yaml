packages:
  - "apps/*"
  - "packages/*"
  - "bundles/*"
allowBuilds:
  # Ships prebuilt binaries; its install script is only a from-source fallback.
  '@parcel/watcher': false
  # Usage telemetry pulled in by NodeCG's dashboard; keep it off.
  '@vaadin/vaadin-usage-statistics': false
  argon2: true
  better-sqlite3: true
  esbuild: true
  msgpackr-extract: true
patchedDependencies:
  nodecg@2.8.0: patches/nodecg@2.8.0.patch
